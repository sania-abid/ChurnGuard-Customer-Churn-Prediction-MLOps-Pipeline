[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-mlops"
version = "0.1.0"
description = "End-to-end customer churn prediction project with training, FastAPI serving, optional MLflow, Docker, and CI."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Codex" }]
dependencies = [
  "fastapi>=0.110",
  "joblib>=1.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pydantic>=2.7",
  "scikit-learn>=1.4",
  "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
]
mlops = [
  "gradio>=5.0",
  "great-expectations>=0.18.21,<0.19",
  "mlflow>=2.18,<3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
